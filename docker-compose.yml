services:
  flooder:
    build: .
    image: friendquiz-flooder
    container_name: friendquiz-flooder
    ports:
      - "5000:5000"
    environment:
      # --- Server ---
      HOST: 0.0.0.0
      PORT: 5000
      # --- Quiz ---
      QUIZ_CODE: ""
      # --- Volume ---
      COUNT: 100
      THREADS: 8
      DELAY_MS: 0
      # --- Score control ---
      SCORE_MODE: random          # perfect | exact | range | random
      EXACT_SCORE: 10
      MIN_SCORE: 0
      MAX_SCORE: 10
      # --- Names ---
      NAME_MODE: random           # random | counter | list
      NAME_PREFIX: ""
      NAME_SUFFIX: ""
      MIN_LEN: 3
      MAX_LEN: 8
      NAME_LETTERS: "true"
      NAME_DIGITS: "true"
      NAMES_LIST: ""
    volumes:
      - ./config.json:/app/config.json
      - ./static:/app/static
    restart: unless-stopped
