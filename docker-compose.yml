services:
  flooder:
    build: .
    image: friendquiz-flooder
    ports:
      # App is exposed on a high, rarely-used host port to avoid clashes
      # with common services. Change it in Coolify's "Ports Mappings"
      # section (or here) — env vars do not control the port mapping.
      - "18080:5000"
    environment:
      # --- Server (fixed) ---
      # The app always listens on 5000 inside the container, which is what
      # the port mapping above expects. Don't change these.
      HOST: 0.0.0.0
      PORT: 5000
      # Settings are persisted to a named volume (see `volumes:` below).
      CONFIG_PATH: /config/config.json
      # --- Editable app settings ---
      # These show up in Coolify's Environment Variables tab. If a variable
      # appears locked in your Coolify version, delete it from this block and
      # add it manually in the Coolify UI instead (managed vars are editable).
      QUIZ_CODE: ${QUIZ_CODE:-}
      COUNT: ${COUNT:-100}
      THREADS: ${THREADS:-8}
      DELAY_MS: ${DELAY_MS:-0}
      SCORE_MODE: ${SCORE_MODE:-random}   # perfect | exact | range | random
      EXACT_SCORE: ${EXACT_SCORE:-10}
      MIN_SCORE: ${MIN_SCORE:-0}
      MAX_SCORE: ${MAX_SCORE:-10}
      NAME_MODE: ${NAME_MODE:-random}     # random | counter | list
      NAME_PREFIX: ${NAME_PREFIX:-}
      NAME_SUFFIX: ${NAME_SUFFIX:-}
      MIN_LEN: ${MIN_LEN:-3}
      MAX_LEN: ${MAX_LEN:-8}
      NAME_LETTERS: ${NAME_LETTERS:-true}
      NAME_DIGITS: ${NAME_DIGITS:-true}
      NAMES_LIST: ${NAMES_LIST:-}
    volumes:
      # Dashboard UI and code come from the image itself — no bind mounts,
      # which keeps the dashboard reachable even if a host folder is missing.
      # Settings persist across redeploys in this named volume.
      - flooder-config:/config
    restart: unless-stopped

volumes:
  flooder-config:
